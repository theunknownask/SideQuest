<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideQuest - Chore & Reward RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Poppins:wght@400;600;800&family=Vazirmatn:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
            --font-family: 'Poppins', sans-serif;
            --slogan-display: block;
        }

        /* Theme Presets */
        body.theme-rm {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --accent: #fbbf24;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border: rgba(56, 189, 248, 0.3);
        }

        body.theme-barca {
            --bg-gradient: linear-gradient(135deg, #020617 0%, #7f1d1d 50%, #1e3a8a 100%);
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --accent: #fbbf24;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border: rgba(251, 191, 36, 0.3);
        }

        body.theme-mha {
            --bg-gradient: linear-gradient(135deg, #18181b 0%, #047857 50%, #1e1b4b 100%);
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #38bdf8;
            --card-bg: rgba(24, 24, 27, 0.85);
            --border: rgba(16, 185, 129, 0.3);
        }

        body.theme-op {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #b91c1c 50%, #b45309 100%);
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --accent: #ef4444;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border: rgba(245, 158, 11, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* Background Slogan Watermark */
        .bg-slogan {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-align: right;
            line-height: 1.1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 50px;
        }

        /* Top Header & Language Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .app-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lang-flags {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .flag-btn {
            background: none;
            border: 2px solid transparent;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flag-btn:hover {
            transform: scale(1.15);
        }

        .flag-btn.active {
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
        }

        .flag-upload-trigger {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .flag-upload-trigger:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .stat-icon {
            font-size: 2.2rem;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
        }

        .stat-info h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info p {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-color);
        }

        /* Card Panels */
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .panel h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        /* Quest Generator Input */
        .quest-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.primary-btn:hover {
            background: var(--primary-hover);
        }

        button.primary-btn:active {
            transform: scale(0.98);
        }

        /* Quest List */
        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .quest-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .quest-details h4 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .quest-rewards {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
        }

        /* Hold to Claim Button */
        .hold-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .hold-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--success);
            opacity: 0.4;
            transition: width 0.05s linear;
            z-index: 0;
        }

        .hold-btn span {
            position: relative;
            z-index: 1;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .shop-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .shop-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .shop-info h3 {
            font-size: 1.05rem;
            margin-bottom: 5px;
        }

        .shop-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .shop-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-tag {
            font-weight: 800;
            color: var(--accent);
        }

        .buy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .buy-btn:hover:not(:disabled) {
            background: var(--primary);
        }

        .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-weight: 600;
            z-index: 1000;
            transition: transform 0.3s ease;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
        }

        .toast.success {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.15);
        }

        /* Modal for Flag Uploads */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            font-size: 1.2rem;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.4);
            transition: border-color 0.2s;
        }

        .drop-zone:hover {
            border-color: var(--primary);
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            align-self: flex-end;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body class="theme-rm">

            </div>

        <!-- Quest Creator Panel -->
        <div class="panel">
            <h2 id="questHeader">🗡️ <span data-i18n="createQuestTitle">Generate Quest for Unwanted Chore</span></h2>
            <div class="quest-form">
                <div class="input-group">
                    <input type="text" id="choreInput" data-i18n-placeholder="chorePlaceholder" placeholder="What chore do you dislike? (e.g. Wash dishes)">

            <p style="font-size: 0.85rem; color: var(--text-muted);" data-i18n="modalDesc">Drop an image or select a language to customize its flag:</p>
            <select id="modalLangSelect" style="background:#0f172a; color:white; padding:10px; border-radius:8px; border:1px solid var(--border);">
                <option value="en">English (🇬🇧)</option>
                <option value="ar">Arabic (🇴🇲)</option>
                <option value="fa">Persian (🇮🇷)</option>
                <option value="es">Spanish (🇪🇸)</option>

            <div class="drop-zone" id="dropZone" ondragover="overDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropFlag(event)" onclick="document.getElementById('fileInput').click()">

        const themes = [
            { id: 'theme-rm', name: 'Real Madrid', slogan: 'Hala Madrid', cost: 0, unlocked: true },
            { id: 'theme-barca', name: 'Barcelona', slogan: 'Més que un club', cost: 100, unlocked: false },
            { id: 'theme-mha', name: 'My Hero Academia', slogan: 'Plus Ultra', cost: 150, unlocked: false },
            { id: 'theme-op', name: 'One Piece', slogan: 'Find the One Piece', cost: 200, unlocked: false }
        ];

        // Custom Rewards Data
        const rewards = [
            { id: 'rew-1', name: '1 Hour Gaming Pass', cost: 50 },
            { id: 'rew-2', name: 'Favorite Snack Treat', cost: 80 },
            { id: 'rew-3', name: 'Movie Night Choice', cost: 120 }
        ];

        // State Management
        let state = {
            lang: 'en',
            xp: 0,
            coins: 0,
            activeTheme: 'theme-rm',
            quests: [
                { id: 1, textKey: 'dishes', customText: '', xp: 50, coins: 20, claimed: false }
            ],
            unlockedThemes: ['theme-rm'],
            customFlags: {}
        };

        const defaultChoreKeys = {
            dishes: { en: 'Wash Dishes', ar: 'غسيل الأطباق', fa: 'شستن ظرف‌ها', es: 'Lavar Platos' }
        };

        function loadState() {
            const saved = localStorage.getItem('sidequest_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch(e) {}
            }
        }

        function saveState() {
            localStorage.setItem('sidequest_state', JSON.stringify(state));
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastNotification');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        function setLanguage(lang) {
            state.lang = lang;
            document.documentElement.setAttribute('dir', translations[lang].dir);
            document.querySelectorAll('.flag-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            saveState();
            renderUI();
        }

        function containsProfanity(text) {
            const lower = text.toLowerCase().trim();
            // Check gibberish / spam patterns (e.g. repeated single characters or random keyboard smashing)
            if (/^(.)\1{4,}$/.test(lower) || lower.length < 2) return true;
            return badWords.some(word => lower.includes(word));
        }

        function generateQuest() {
            const input = document.getElementById('choreInput');
            const val = input.value.trim();
            if (!val) return;

            if (containsProfanity(val)) {
                showToast(translations[state.lang].profanityError, 'error');
                input.value = '';
                return;
            }

            const newQuest = {
                id: Date.now(),
                textKey: null,
                customText: val,
                xp: Math.floor(Math.random() * 40) + 40,
                coins: Math.floor(Math.random() * 20) + 15,
                claimed: false
            };

            state.quests.unshift(newQuest);
            input.value = '';
            saveState();
            renderUI();
            showToast(translations[state.lang].questAdded, 'success');
        }

        function claimQuest(id) {
            const q = state.quests.find(item => item.id === id);
            if (!q || q.claimed) return;

            q.claimed = true;
            state.xp += q.xp;
            state.coins += q.coins;
            saveState();
            renderUI();
            showToast(translations[state.lang].rewardClaimed, 'success');
        }

        function setTheme(themeId) {
            const th = themes.find(t => t.id === themeId);
            if (!th) return;

            if (!state.unlockedThemes.includes(themeId)) {
                if (state.coins >= th.cost) {
                    state.coins -= th.cost;
                    state.unlockedThemes.push(themeId);
                    state.activeTheme = themeId;
                    showToast(translations[state.lang].themeUnlocked, 'success');
                } else {
                    showToast(translations[state.lang].notEnoughCoins, 'error');
                    return;
                }
            } else {
                state.activeTheme = themeId;
            }

            saveState();
            renderUI();
        }

        function buyReward(cost) {
            if (state.coins >= cost) {
                state.coins -= cost;
                saveState();
                renderUI();
                showToast(translations[state.lang].rewardUnlocked, 'success');
            } else {
                showToast(translations[state.lang].notEnoughCoins, 'error');
            }
        }

        // Flag Modal Controls
        function openFlagModal() {
            document.getElementById('flagModal').classList.add('show');
        }
        function closeFlagModal() {
            document.getElementById('flagModal').classList.remove('show');
        }
        function overDrop(e) { e.preventDefault(); }
        function leaveDrop(e) { e.preventDefault(); }
        function dropFlag(e) {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) processFlagFile(file);
        }
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) processFlagFile(file);
        }
        function processFlagFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const lang = document.getElementById('modalLangSelect').value;
                state.customFlags[lang] = event.target.result;
                saveState();
                renderUI();
                closeFlagModal();
                showToast('Flag updated successfully!', 'success');
            };
            reader.readAsDataURL(file);
        }

        // Render UI
        function renderUI() {
            const t = translations[state.lang];

            // Apply Theme
            document.body.className = state.activeTheme;
            const currentThemeObj = themes.find(th => th.id === state.activeTheme);
            const sloganEl = document.getElementById('bgSlogan');
            if (currentThemeObj) {
                sloganEl.textContent = currentThemeObj.slogan;
            }

            // Stats
            document.getElementById('xpValue').textContent = state.xp;
            document.getElementById('coinsValue').textContent = state.coins;

            // Static Text Localization
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });

            // Custom Flags Rendering
            ['en', 'ar', 'fa', 'es'].forEach(lang => {
                const btn = document.getElementById(`btn-${lang}`);
                if (state.customFlags[lang]) {
                    btn.innerHTML = `<img src="${state.customFlags[lang]}" style="width:28px;height:20px;object-fit:cover;border-radius:4px;">`;
                }
            });

            // Render Quests List
            const questListEl = document.getElementById('questList');
            questListEl.innerHTML = '';
            state.quests.forEach(q => {
                if (q.claimed) return; // Disappear once claimed as requested

                let questTitle = q.customText;
                if (q.textKey && defaultChoreKeys[q.textKey]) {
                    questTitle = defaultChoreKeys[q.textKey][state.lang] || defaultChoreKeys[q.textKey]['en'];
                }

                const div = document.createElement('div');
                div.className = 'quest-item';
                div.innerHTML = `
                    <div class="quest-details">
                        <h4>${questTitle}</h4>
                        <div class="quest-rewards">+${q.xp} XP | +${q.coins} 🪙</div>
                    </div>
                    <button class="hold-btn" onmousedown="startHold(event, ${q.id})" ontouchstart="startHold(event, ${q.id})" onmouseup="cancelHold()" ontouchend="cancelHold()" onmouseleave="cancelHold()">
                        <span>${t.claimBtn}</span>
                    </button>
                `;
                questListEl.appendChild(div);
            });

            // Render Theme Shop
            const themeGrid = document.getElementById('themeShopGrid');
            themeGrid.innerHTML = '';
            themes.forEach(th => {
                const unlocked = state.unlockedThemes.includes(th.id);
                const isCurrent = state.activeTheme === th.id;
                const card = document.createElement('div');
                card.className = 'shop-card';
                card.innerHTML = `
                    <div class="shop-info">
                        <h3>${th.name}</h3>
                        <p>${th.slogan}</p>
                    </div>
                    <div class="shop-action">
                        <span class="price-tag">${th.cost === 0 ? 'Free' : th.cost + ' 🪙'}</span>
                        <button class="buy-btn" ${isCurrent ? 'disabled' : ''} onclick="setTheme('${th.id}')">
                            ${isCurrent ? 'Active' : (unlocked ? 'Equip' : t.buyBtn)}
                        </button>
                    </div>
                `;
                themeGrid.appendChild(card);
            });

            // Render Rewards Shop
            const rewardGrid = document.getElementById('rewardShopGrid');
            rewardGrid.innerHTML = '';
            rewards.forEach(rew => {
                const card = document.createElement('div');
                card.className = 'shop-card';
                card.innerHTML = `
                    <div class="shop-info">
                        <h3>${rew.name}</h3>
                        <p>Custom Reward</p>
                    </div>
                    <div class="shop-action">
                        <span class="price-tag">${rew.cost} 🪙</span>
                        <button class="buy-btn" onclick="buyReward(${rew.cost})">${t.buyBtn}</button>
                    </div>
                `;
                rewardGrid.appendChild(card);
            });
        }

        // Hold-to-Claim Interaction Logic
        let holdTimer = null;
        let holdProgressInterval = null;

        function startHold(e, id) {
            const btn = e.currentTarget;
            let progress = 0;
            const duration = 1000; // 1 second hold
            const intervalTime = 20;
            const step = (intervalTime / duration) * 100;

            holdProgressInterval = setInterval(() => {
                progress += step;
                btn.style.setProperty('--before-width', progress + '%');
                const fillBar = btn.querySelector('::before') || btn;
                fillBar.style.background = `linear-gradient(90deg, rgba(16,185,129,0.4) ${progress}%, transparent ${progress}%)`;

                if (progress >= 100) {
                    clearInterval(holdProgressInterval);
                    claimQuest(id);
                }
            }, intervalTime);
        }

        function cancelHold() {
            if (holdProgressInterval) clearInterval(holdProgressInterval);
            document.querySelectorAll('.hold-btn').forEach(btn => {
                btn.style.background = 'rgba(255, 255, 255, 0.08)';
            });
        }

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            setLanguage(state.lang);
        });
    </script>
</body>
</html>
